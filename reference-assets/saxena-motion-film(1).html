const cxB = j => layB.x0 + (GB[j].g.x + GB[j].cxl) * kA;
const srcOf = j => Math.round(j * (GA.length - 1) / (GB.length - 1));   // 12 strokes become 14

function hopPoint(k, t) { const s = spreadAt(t); return k === 0 ? layA(s).per : [cxA(7 + k, s), capTop1 - 16]; }

function dotS1(t) {
  if (t < 0.28) return [960, 540];
  if (t < 0.875) {
    const per = layA(0).per, ux = E.inOutCubic(seg(t, .28, .48)), u = seg(t, .40, .52);
    return [lerp(960, per[0], ux), lerp(540, per[1], E.outCubic(u)) - 18*Math.sin(Math.PI*u)];
  }
  if (t < 1.375) {
    let k = 0; while (k < 3 && t >= HOPS[k+1]) k++;
    const u = seg(t, HOPS[k], HOPS[k+1]), a = hopPoint(k, t), b = hopPoint(k+1, t), e = E.inOutSine(u);
    return [lerp(a[0], b[0], e), lerp(a[1], b[1], e) - (k === 0 ? 70 : 30) * Math.sin(Math.PI*u)];
  }
  if (t < 1.7) {
    const a = hopPoint(4, t), b = layB.per, u = seg(t, 1.375, 1.7), e = E.inOutCubic(u);
    return [lerp(a[0], b[0], e), lerp(a[1], b[1], e) - 60*Math.sin(Math.PI*u)];
  }
  return layB.per;
}

function hairState(t) {
  if (t < 0.12) return null;
  if (t < 1.5) { const L = layA(spreadAt(t)), p = sp(t, .12, .45, .75, 14); return [lerp(960, L.L, p), lerp(960, L.R, p)]; }
  if (t < 2.3) { const A = layA(1), u = sp(t, 1.5, .4, .8, 12); return [lerp(A.L, layB.L, u), lerp(A.R, layB.R, u)]; }
  if (t < 2.55) { const u = E.inOutCubic(seg(t, 2.3, 2.55)), x = layB.per[0]; return [lerp(layB.L, x, u), lerp(layB.R, x, u)]; }
  if (t >= 16.9 && t < 17.8) {
    const A = layA(0), ox = A.per[0], p = sp(t, 16.9, .45, .75, 14), u = E.inOutCubic(seg(t, 17.4, 17.8));
    return [lerp(lerp(ox, A.L, p), 960, u), lerp(lerp(ox, A.R, p), 960, u)];
  }
  return null;
}

function renderS1(t) {
  /* registration ring at the first beat */
  const ru = seg(t, 0, 0.55);
  if (ru > 0 && ru < 1) { at(ring, {cx:960, cy:540, r:n1(11 + 70*E.outCubic(ru)), opacity:(0.55*Math.sin(Math.PI*Math.min(1, ru*2.2))*(1-ru)).toFixed(3)}); show(ring, 1); }
  else show(ring, 0);

  const h = hairState(t);
  if (h && h[1] - h[0] > 0.5) { at(hair, {x1:n1(h[0]), x2:n1(h[1]), y1:540, y2:540}); show(hair, 1); } else show(hair, 0);

  /* MORE THAN SKIN. */
  if (t > 0.25 && t < 1.5) {
    const s = spreadAt(t), LA = layA(s);
    GA.forEach((it, i) => {
      const dy = 150 * (1 - sp(t, 0.30 + 0.012*i, 0.36, 0.75, 15));
      const m = i >= 8 ? E.inOutCubic(seg(t, HOPS[i-7] + 0.02, HOPS[i-7] + 0.11))
                       : E.inOutCubic(seg(t, 1.10 + 0.025*i, 1.19 + 0.025*i));
      drawGlyph(it, LA.x0 + offA(i, s), kA, BL1, m, dy);
    });
  } else hideGlyphs(GA);

  /* strokes travel and re-form as SPECIALIST CARE. */
  if (t >= 1.5 && t < 2.6) {
    GB.forEach((it, j) => {
      const src = cxA(srcOf(j), 1), dst = cxB(j), u = sp(t, 1.5 + 0.006*j, 0.35, 0.8, 14);
      const m = t < 2.2 ? 1 - E.inOutCubic(seg(t, 1.60 + 0.01*j, 1.72 + 0.01*j))
                        : E.inOutCubic(seg(t, 2.2 + 0.008*j, 2.3 + 0.008*j));
      const dy = 130 * E.inCubic(seg(t, 2.3, 2.5));
      const x = lerp(src, dst, u);
      drawGlyph(it, x - (it.g.x + it.cxl)*kA, kA, BL1, m, dy);
    });
  } else hideGlyphs(GB);

  /* the dot's path between the letters */
  if (t > 0.875 && t < 1.6) {
    const pts = [], tEnd = Math.min(t, 1.375);
    for (let i = 0; i <= 48; i++) pts.push(dotS1(lerp(0.875, tEnd, i/48)));
    const tail = HOPS.findIndex(h => h > tEnd); const startI = 0;
    at(trail, {d:smoothPath(pts.slice(startI), false), opacity:(1 - seg(t, 1.38, 1.58)).toFixed(3)}); show(trail, 1);
    touch.forEach((c, k) => { const on = t >= HOPS[k+1]; if (on) { const p = hopPoint(k+1, t); at(c, {cx:n1(p[0]), cy:n1(p[1]), opacity:(1 - seg(t, 1.38, 1.58)).toFixed(3)}); } show(c, on && t < 1.58); });
  } else { show(trail, 0); touch.forEach(c => show(c, 0)); }
}

/* =========================================================================

   ========================================================================= */
const PEAK = [1060, 360], ORIGIN = [200, 780], CC = [560, 560];
const NP = 200, NC = 120;
function contourR(i, th) { return (50 + i*36) * (1 + 0.10*Math.sin(3*th + 0.55*i) + 0.06*Math.sin(5*th - 0.8*i) + 0.03*Math.sin(7*th + 1.3)); }
function contourPt(i, th, sc = 1) { const r = contourR(i, th) * sc; return [CC[0] + 1.3*r*Math.cos(th), CC[1] + 0.62*r*Math.sin(th)]; }
function pushFrom(p, d, amt = 22, sig = 75) {      // the dot deflects the contour lines it passes
  const dx = p[0] - d[0], dy = p[1] - d[1], dist = Math.hypot(dx, dy) || 1;
  const f = amt * Math.exp(-(dist*dist) / (2*sig*sig));
  return [p[0] + dx/dist*f, p[1] + dy/dist*f];
}
function curvePt(s, end) { return bez3(ORIGIN, [520, 772], [760, 420], end, s); }

function dotS2(t) {
  const b = layB.per;
  if (t < 2.25) return b;
  if (t < 2.5) return [b[0], lerp(b[1], 540, E.outCubic(seg(t, 2.25, 2.42)))];
  if (t < 2.9) return [lerp(b[0], 150, E.inOutCubic(seg(t, 2.5, 2.85))), 540];
  if (t < 3.5) { const u = seg(t, 2.9, 3.5), p = -0.4*u*u*u + 1.4*u*u; return bez3([150, 540], [400, 720], [800, 560], PEAK, p); }
  if (t < 4.72) { const tau = t - 3.5; return [PEAK[0], PEAK[1] - 40*Math.exp(-8.1*tau)*Math.sin(16.07*tau)]; }   // graph spring
  const u = E.inOutCubic(seg(t, 4.72, 5.0)); return L2([PEAK[0], dotS2(4.7199)[1]], [792, 600], u);
}

const contours = [0,1,2,3,4,5].map(() => el('path', {fill:'none', stroke:CH, 'stroke-width':1.25}, L2g));
const CONT_OP = [0.95, 0.85, 0.75, 0.65, 0.55, 0.45];

const tickL = TICKX.map((x, i) => { const e = el('text', {x, y:812, 'text-anchor':'middle', 'font-family':MONO, 'font-size':16, 'font-weight':500, fill:GREY}, L2g); e.textContent = TICKL[i]; return e; });

function penPoints(t, dot) {
  const P = [];
  if (t < 2.5) return null;
  const S = [layB.per[0], 540];
  const sweep = j => L2(S, [dot[0] < S[0] ? Math.min(dot[0], S[0]) : S[0], 540], j/(NP-1));
  if (t < 2.85) { for (let j = 0; j < NP; j++) P.push(L2(S, [dotS2(t)[0], 540], j/(NP-1))); return {P}; }
  const swEnd = j => L2(S, [150, 540], j/(NP-1));
  const thJ = j => Math.PI/2 + 2*Math.PI*(1 - j/(NP-1));       // the line lassos into the outer contour, ends meeting at its base
  const loop = j => pushFrom(contourPt(6, thJ(j)), dot);
  if (t < 3.1) { const u = sp(t, 2.85, 0.35, 0.8, 12); for (let j = 0; j < NP; j++) P.push(L2(swEnd(j), loop(j), u)); return {P}; }
  if (t < 3.5) {
    const u = sp(t, 3.1, 0.4, 0.8, 12);
    for (let j = 0; j < NP; j++) { const s = (1 + Math.cos(thJ(j))) / 2; P.push(L2(loop(j), curvePt(s, dot), u)); }
    return {P};
  }
  if (t < 4.85) {
    const a = E.inOutCubic(seg(t, 4.5, 4.8));
    if (a >= 0.999) return null;
    for (let j = 0; j < NP; j++) P.push(curvePt(lerp(a, 1, j/(NP-1)), dot));
    return {P};
  }
  return null;
}

function renderS2(t) {
  const on = t >= 2.4 && t < 5.0;

    if (op <= 0.003 || sc <= 0.01) { show(c, 0); return; }
    const P = []; for (let j = 0; j < NC; j++) P.push(pushFrom(contourPt(i, 2*Math.PI*j/NC, sc), dot, 18, 70));
    at(c, {d:smoothPath(P, true), 'stroke-opacity':op.toFixed(3)}); show(c, 1);

  const fadeOut = 1 - seg(t, 4.5, 4.68);
  TICKX.forEach((x, i) => {

  const dp = E.outCubic(seg(t, 3.5, 3.7));
  if (dp > 0 && fadeOut > 0) { at(drop, {y2:n1(lerp(372, 780, dp)), opacity:fadeOut.toFixed(3)}); show(drop, 1); } else show(drop, 0);
  const cp = E.outCubic(seg(t, 3.46, 3.58)), cOut = E.inCubic(seg(t, 4.6, 4.75));

  T2.forEach((Lr, i) => {
    const pin = i === 2 ? sp(t, T2IN[i], 0.55, 0.6, 15) : sp(t, T2IN[i], 0.4, 0.8, 16);
    reveal(Lr, pin, E.inCubic(seg(t, 4.62 + 0.02*i, 4.84 + 0.02*i)));
  });
}

[[0,1,64,.95,7.5],[1,2,64,.95,7.56],[2,3,64,.95,7.62],[3,4,64,.95,7.68],[0,2,128,.6,7.72],[1,3,128,.6,7.78],[2,4,128,.6,7.84],[0,4,230,.4,7.9]]

    /* 2 hair restoration — a single flowing strand rising from its root */

  thirds.forEach(e => { at(e, {opacity:th.toFixed(3)}); show(e, th > 0); });
  W4.forEach((Lr, i) => {
    const t0 = MT[i] + 0.03, pin = sp(t, t0, 0.45, 0.8, 15);
    const pout = E.inCubic(seg(t, 11.82 + 0.03*i, 12.12 + 0.03*i));
    reveal(Lr, pin, pout);
    const ls = lerp(22, 0, sp(t, t0, 0.5, 0.85, 12));
    const dim = i < 4 ? E.inOutSine(seg(t, MT[i+1], MT[i+1] + 0.25)) : 0;
    at(Lr.tx, {'letter-spacing':n1(ls), fill:mixHex(INK, MUTE, dim)});
  });
  return P;
}

/* =========================================================================
   SCENE 05 — BRAND REVEAL (12 – 16)   &   SCENE 06 — THE LOOP (16 – 18)
   ========================================================================= */
const LOGO_C = [960, 295], LOGO_D = 200, BUTTERFLY = [960, 295 + LOGO_D*(312/579 - 0.5)];
const kS = 0.18, BLS = 600, LS_S = 7;
const WS = G.strings['SAXENA'].width * kS + LS_S * 5, xS = 960 - WS/2;
const RULE_Y = 660, BRAND_DOT = [960, RULE_Y];
const GS = glyphs('SAXENA', LB, IV);
let logoImg = null, logoClip = null;
if (LOGO) {
  const id = 'logoclip'; const cp = el('clipPath', {id}, defs); logoClip = el('circle', {cx:BUTTERFLY[0], cy:BUTTERFLY[1], r:0}, cp);
  const g = el('g', {'clip-path':`url(#${id})`}, LB);
  logoImg = el('image', {href:LOGO.src, x:LOGO_C[0] - LOGO_D/2, y:LOGO_C[1] - LOGO_D/2, width:LOGO_D, height:LOGO_D, preserveAspectRatio:'xMidYMid meet'}, g);
}
const ruleL = el('line', {y1:RULE_Y, y2:RULE_Y, stroke:CH, 'stroke-width':1.25}, LB);
const ruleR = el('line', {y1:RULE_Y, y2:RULE_Y, stroke:CH, 'stroke-width':1.25}, LB);
const clinic = el('text', {y:730, 'text-anchor':'middle', 'font-family':SANS, 'font-weight':600, 'font-size':36, fill:IV}, LB);
clinic.textContent = 'SKIN AND COSMETIC CLINIC';
const TAG = line(LB, {text:'SPECIALIST CARE. ADVANCED EXPERTISE.', x:962, y:812, size:22, weight:500, fill:CH, ls:4.5, anchor:'middle'});
const loc = el('text', {y:990, 'text-anchor':'middle', 'font-family':MONO, 'font-weight':500, 'font-size':18, fill:LGREY}, LB);
loc.textContent = 'JABALPUR, MADHYA PRADESH';

function brandDot(t) {     // where the dot lives once the circle has contracted
  const target = LOGO ? BUTTERFLY : BRAND_DOT;
  if (t < 13.45) return target;
  if (!LOGO) return BRAND_DOT;
  const u = seg(t, 13.55, 13.85); return [960, lerp(BUTTERFLY[1], RULE_Y, E.inOutCubic(u))];
}

function renderS5(t) {
  const on = t >= 13.0 && t < 16.6;
  showG(LB, on); if (!on) return;
  /* SAXENA builds from strokes */
  GS.forEach((it, i) => {
    let m, h, op = 1;
    if (t < 16) { h = E.outCubic(seg(t, 13.2 + 0.03*i, 13.38 + 0.03*i)); m = 1 - E.inOutCubic(seg(t, 13.36 + 0.035*i, 13.56 + 0.035*i)); }
    else { m = E.inOutCubic(seg(t, 16.0 + 0.025*i, 16.12 + 0.025*i)); h = 1 - E.inCubic(seg(t, 16.15 + 0.025*i, 16.3 + 0.025*i)); }
    if (h <= 0.002 && m >= 0.999) { show(it.path, 0); show(it.stroke, 0); return; }
    drawGlyph(it, xS + LS_S*i, kS, BLS, m, 0, h, op);
  });
  if (LOGO) {
    const rOpen = E.outCubic(seg(t, 13.35, 13.8)) * (1 - E.inCubic(seg(t, 16.0, 16.3)));
    at(logoClip, {r:n1(rOpen * 132)});
    const sc = lerp(0.94, 1, sp(t, 13.35, 0.6, 0.7, 12));
    at(logoImg, {transform:`translate(${LOGO_C[0]} ${LOGO_C[1]}) scale(${sc.toFixed(4)}) translate(${-LOGO_C[0]} ${-LOGO_C[1]})`});
  }
  const rp = E.inOutCubic(seg(t, LOGO ? 13.75 : 13.45, LOGO ? 14.1 : 13.8)) * (1 - E.inOutCubic(seg(t, 16.05, 16.3)));
  if (rp > 0.002) { at(ruleL, {x1:938, x2:n1(lerp(938, 780, rp))}); at(ruleR, {x1:982, x2:n1(lerp(982, 1140, rp))}); show(ruleL, 1); show(ruleR, 1); }
  else { show(ruleL, 0); show(ruleR, 0); }
  const fade = 1 - seg(t, 16.0, 16.2);
  const ls = lerp(30, 10, E.outCubic(seg(t, 13.75, 14.3))) + 6*seg(t, 16.0, 16.2);
  const cop = seg(t, 13.75, 14.05) * fade;
  at(clinic, {x:n1(960 + ls/2), 'letter-spacing':n1(ls), opacity:cop.toFixed(3)}); show(clinic, cop > 0);
  reveal(TAG, sp(t, 14.25, 0.45, 0.8, 15), E.inCubic(seg(t, 16.0, 16.22)));
  const lop = seg(t, 14.75, 15.05) * fade, lls = lerp(12, 5, E.outCubic(seg(t, 14.75, 15.2)));
  at(loc, {x:n1(960 + lls/2), 'letter-spacing':n1(lls), opacity:lop.toFixed(3)}); show(loc, lop > 0);
}

function dotS6(t) {
  const B = LOGO ? [960, RULE_Y] : BRAND_DOT, A0 = layA(0).per;
  if (t < 16.25) return B;
  if (t < 16.5) { const u = seg(t, 16.25, 16.5), e = E.inOutCubic(u); return [lerp(B[0], A0[0], e), lerp(B[1], A0[1], e) - 80*Math.sin(Math.PI*u)]; }
  if (t < 17.0) return A0;
  if (t < 17.15) { const u = seg(t, 17.0, 17.15); return [A0[0], lerp(A0[1], 540, E.outCubic(u)) - 14*Math.sin(Math.PI*u)]; }
  if (t < 17.5) return [lerp(A0[0], 960, E.inOutCubic(seg(t, 17.15, 17.5))), 540];
  return [960, 540];
}

/* =========================================================================
   THE DOT — one element, present from the first frame to the last
   ========================================================================= */
const five = [0,1,2,3,4].map(() => el('circle', {r:9, fill:TEAL}, LD));
const dot = el('circle', {r:R0, fill:TEAL}, LD);
LD.parentNode.appendChild(LB);         // brand type sits above the expanding dot

function renderDot(t, P) {
  let p, r = R0;
  if (t < 2.2) { p = dotS1(t); r = R0 * (1 + 0.18*Math.sin(Math.PI*seg(t, 0, 0.3))); }
  else if (t < 5.0) p = dotS2(t);
  else if (t < 12.35) p = null;
  else if (t < 13.0) { p = C; r = t < 12.5 ? lerp(9, R0, E.outCubic(seg(t, 12.35, 12.45))) : lerp(R0, 1150, E.inCubic(seg(t, 12.5, 13.0))); }
  else if (t < 16.0) {
    const u = E.outQuart(seg(t, 13.0, 13.45)), tgt = brandDot(t);
    p = t < 13.45 ? L2(C, tgt, E.outCubic(seg(t, 13.0, 13.45))) : tgt; r = lerp(1150, R0, u);
  }
  else p = dotS6(t);
  if (p) { at(dot, {cx:n1(p[0]), cy:n1(p[1]), r:n1(r)}); show(dot, 1); } else show(dot, 0);

  if (t >= 5.0 && t < 12.35 && P) {
    const Q = dots5(t, P);
    Q.forEach((q, i) => {
      let rr = t < 5.1 ? lerp(R0, 9, seg(t, 5.0, 5.1)) : 9;
      const ti = 5.5 + 0.5*i; rr += 3*Math.sin(Math.PI*seg(t, ti, ti + 0.2));
      at(five[i], {cx:n1(q[0]), cy:n1(q[1]), r:n1(rr)}); show(five[i], 1);
    });
  } else five.forEach(c => show(c, 0));
}

/* =========================================================================
   seek(t) — the master timeline
   ========================================================================= */
function seek(t) {
  t = ((t % D) + D) % D;
  const dark = t >= 13.0 && t < 16.95;
  at(bg, {fill: dark ? INK : IV});
  if (t >= 16.5 && t < 16.95) { const A0 = layA(0).per; at(iris, {cx:n1(A0[0]), cy:n1(A0[1]), r:n1(1850*E.inCubic(seg(t, 16.5, 16.95)))}); show(iris, 1); }
  else show(iris, 0);
  renderS1(t);
  renderS2(t);
  const P = renderS34(t);
  renderS5(t);
  renderDot(t, P);
  return t;
}

/* =========================================================================
   SOUND — synthesised offline, deterministic, seamless 18 s loop at 120 BPM
   ========================================================================= */
let audioBuf = null;
async function renderAudio() {
  const SR = 48000, LEN = 20;
  const ctx = new OfflineAudioContext(2, SR*LEN, SR);
  let seed = 7; const rnd = () => (seed = (seed*1664525 + 1013904223) >>> 0) / 4294967296;
  const noise = ctx.createBuffer(1, SR*2, SR); { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd()*2 - 1; }
  const ir = ctx.createBuffer(2, SR*2.4, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (rnd()*2 - 1) * Math.exp(-3.2*i/SR); }
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.2;
  const master = ctx.createGain(); master.gain.value = 0.9; master.connect(comp); comp.connect(ctx.destination);
  const verb = ctx.createConvolver(); verb.buffer = ir; const vg = ctx.createGain(); vg.gain.value = 0.22; verb.connect(vg); vg.connect(master);
  const env = (g, T, a, peak, dec) => { g.gain.setValueAtTime(0.0001, T); g.gain.exponentialRampToValueAtTime(peak, T + a); g.gain.exponentialRampToValueAtTime(0.0001, T + a + dec); };
  function kick(T, amp) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(118, T); o.frequency.exponentialRampToValueAtTime(42, T + 0.14); env(g, T, 0.003, amp, 0.36); o.connect(g); g.connect(master); o.start(T); o.stop(T + 0.45); }
  function noiseHit(T, amp, type, f, q, dec, send = 0) { const s = ctx.createBufferSource(); s.buffer = noise; const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const g = ctx.createGain(); env(g, T, 0.002, amp, dec); s.connect(fl); fl.connect(g); g.connect(master); if (send) { const sg = ctx.createGain(); sg.gain.value = send; g.connect(sg); sg.connect(verb); } s.start(T, (T*0.37) % 1.5); s.stop(T + dec + 0.05); }
  const hat = (T, amp) => noiseHit(T, amp, 'highpass', 7500, 0.7, 0.035);
  function click(T, amp, f = 3200) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; env(g, T, 0.001, amp, 0.025); o.connect(g); g.connect(master); o.start(T); o.stop(T + 0.05); noiseHit(T, amp*0.5, 'bandpass', f*1.4, 4, 0.012); }
  function bell(T, f, amp, dec = 1.2) { [[1, 1], [2, 0.22], [3.01, 0.06]].forEach(([m, a]) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = f*m; env(g, T, 0.004, amp*a, dec/m); o.connect(g); g.connect(master); const sg = ctx.createGain(); sg.gain.value = 0.9; g.connect(sg); sg.connect(verb); o.start(T); o.stop(T + dec + 0.1); }); }
  function sweep(T, dur, f0, f1, amp, rising = true) { const s = ctx.createBufferSource(); s.buffer = noise; s.loop = true; const fl = ctx.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 2.2; fl.frequency.setValueAtTime(f0, T); fl.frequency.exponentialRampToValueAtTime(f1, T + dur); const g = ctx.createGain();
    if (rising) { g.gain.setValueAtTime(0.0001, T); g.gain.exponentialRampToValueAtTime(amp, T + dur*0.85); g.gain.exponentialRampToValueAtTime(0.0001, T + dur); }
    else { g.gain.setValueAtTime(0.0001, T); g.gain.exponentialRampToValueAtTime(amp, T + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, T + dur); }
    s.connect(fl); fl.connect(g); g.connect(master); const sg = ctx.createGain(); sg.gain.value = 0.5; g.connect(sg); sg.connect(verb); s.start(T); s.stop(T + dur + 0.05); }
  function tone(T, dur, f0, f1, amp) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(f0, T); o.frequency.exponentialRampToValueAtTime(f1, T + dur); g.gain.setValueAtTime(0.0001, T); g.gain.exponentialRampToValueAtTime(amp, T + dur*0.9); g.gain.exponentialRampToValueAtTime(0.0001, T + dur); o.connect(g); g.connect(master); o.start(T); o.stop(T + dur + 0.02); }
  function boom(T) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(70, T); o.frequency.exponentialRampToValueAtTime(38, T + 0.9); env(g, T, 0.005, 0.55, 1.3); o.connect(g); g.connect(master); o.start(T); o.stop(T + 1.4); }
  /* sub drone: 55 Hz and 82.5 Hz complete whole cycles in 18 s, so the loop seam is silent */
  [[55, 0.05], [82.5, 0.025]].forEach(([f, a]) => { const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 160; o.frequency.value = f; g.gain.value = a; o.connect(lp); lp.connect(g); g.connect(master); o.start(0); o.stop(LEN); });

  const A3 = 220, C4 = 261.63, D4 = 293.66, E4 = 329.63, G4 = 392, A4 = 440, C5 = 523.25, D5 = 587.33, E5 = 659.25, G5 = 783.99;
  for (let b = 0; b < 18; b++) kick(b, b === 13 ? 0.85 : 0.42);                     // pulse on every second beat…
  for (let b = 5; b < 12; b++) kick(b + 0.5, 0.26);                                // …doubling through the specialists and disciplines
  for (let b = 2; b < 16; b++) hat(b + 0.5, 0.05);
  for (let b = 9; b < 12; b++) { hat(b + 0.25, 0.03); hat(b + 0.75, 0.03); }
  // scene 01
  click(0, 0.22, 3600); click(0.12, 0.1, 2400); click(0.3, 0.16, 2800); bell(0.3, A4, 0.06, 0.9);
  click(0.875, 0.08, 2200); [1.0, 1.125, 1.25, 1.375].forEach((T, i) => click(T, 0.15, 2600 + 380*i));
  sweep(1.5, 0.3, 900, 2600, 0.05); bell(1.75, A4, 0.06, 1.4); bell(1.75, E5, 0.045, 1.4);
  // scene 02
  click(2.2, 0.08, 2400); sweep(2.3, 0.25, 2000, 700, 0.05, false); sweep(2.5, 0.38, 600, 2800, 0.06); sweep(2.85, 0.5, 300, 1800, 0.05);
  click(3.05, 0.1, 3000); kick(3.5, 0.6); bell(3.5, E4, 0.09, 1.6); click(3.5, 0.14, 4200);
  [3.625, 3.75].forEach(T => click(T, 0.06, 3400)); sweep(4.62, 0.38, 2400, 600, 0.05, false);
  // scene 03
  [A3, C4, E4, G4, A4].forEach((f, i) => bell(5.0 + 0.0625*i, f, 0.05, 0.9));
  [A4, C5, D5, E5, G5].forEach((f, i) => { click(5.5 + 0.5*i, 0.1, 3000); bell(5.5 + 0.5*i, f, 0.035, 0.8); });
  [A3, C4, E4].forEach(f => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, 7.5); g.gain.exponentialRampToValueAtTime(0.025, 7.9); g.gain.exponentialRampToValueAtTime(0.0001, 9.0); o.connect(g); g.connect(master); const sg = ctx.createGain(); sg.gain.value = 0.6; g.connect(sg); sg.connect(verb); o.start(7.5); o.stop(9.05); });
  sweep(8.85, 0.3, 2600, 900, 0.04, false);
  // scene 04
  [A4, C5, D5, E5, G5].forEach((f, i) => { const T = 9 + 0.5*i; click(T, 0.12, 3600); bell(T, f, 0.06, 1.0); });
  // scene 05
  sweep(12.0, 0.35, 2600, 500, 0.05, false); sweep(12.5, 0.5, 250, 3500, 0.07); tone(12.5, 0.5, 110, 440, 0.06);
  boom(13.0); kick(13.25, 0.7); [A3, E4, A4, C5].forEach(f => bell(13.25, f, 0.07, 2.6));
  [13.75, 14.25, 14.75].forEach(T => click(T, 0.06, 3000));
  // scene 06
  sweep(16.0, 0.35, 2600, 700, 0.05, false); sweep(16.5, 0.45, 300, 2400, 0.06);
  click(17.0, 0.07, 2600); click(17.5, 0.12, 3400);

  const out = await ctx.startRendering();
  const loop = new AudioBuffer({numberOfChannels:2, length:SR*D, sampleRate:SR});
  for (let c = 0; c < 2; c++) { const s = out.getChannelData(c), d = loop.getChannelData(c);
    for (let i = 0; i < SR*D; i++) d[i] = s[i] + (i < SR*(LEN - D) ? s[i + SR*D] : 0); }       // fold the tail onto the head
  audioBuf = loop;
}

/* =========================================================================
   playback
   ========================================================================= */
const stage = document.getElementById('stage');
function fit() { const s = Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

const q = new URLSearchParams(location.search);
if (q.has('export')) document.documentElement.classList.add('export');
let t = q.has('t') ? parseFloat(q.get('t')) || 0 : 0;
let playing = !q.has('t'), last = null, actx = null, src = null, a0 = 0, soundOn = false;
const ui = document.getElementById('ui'), hint = document.getElementById('hint'), tc = document.getElementById('tc'), scrub = document.getElementById('scrub');
const fmt = x => { const s = Math.floor(x), cs = Math.floor((x - s)*100); return '00:' + String(s).padStart(2,'0') + '.' + String(cs).padStart(2,'0'); };

function stopSrc() { if (src) { try { src.stop(); } catch (e) {} src.disconnect(); src = null; } }
function startSrc() { if (!actx || !audioBuf || !soundOn || !playing) return; stopSrc(); src = actx.createBufferSource(); src.buffer = audioBuf; src.loop = true; src.connect(actx.destination); a0 = actx.currentTime - t; src.start(0, t); }
async function enableSound() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  await actx.resume(); if (!audioBuf) await renderAudio();
  soundOn = true; hint.style.opacity = 0; startSrc(); syncUI();
}
function disableSound() { soundOn = false; stopSrc(); syncUI(); }
function setPlaying(p) { playing = p; last = null; if (p) startSrc(); else stopSrc(); syncUI(); }
function jump(x) { t = ((x % D) + D) % D; last = null; if (playing) startSrc(); seek(t); syncUI(); }
function syncUI() {
  document.getElementById('icoPlay').setAttribute('d', playing ? 'M5 3v10M11 3v10' : 'M5 3l8 5-8 5z');
  document.getElementById('bPlay').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  document.getElementById('icoWave').setAttribute('d', soundOn ? 'M11.5 5.5c1 1.4 1 3.6 0 5M13.5 4c1.8 2.4 1.8 5.6 0 8' : 'M11.5 5.5l3 5M14.5 5.5l-3 5');
  document.getElementById('bSound').setAttribute('aria-label', soundOn ? 'Turn sound off' : 'Turn sound on');
}
function frame(now) {
  if (playing) {
    if (soundOn && src) t = ((actx.currentTime - a0) % D + D) % D;
    else { if (last !== null) t = (t + (now - last)/1000) % D; last = now; }
  }
  seek(t);
  tc.textContent = fmt(t) + ' / 00:18.00';
  if (document.activeElement !== scrub) scrub.value = t.toFixed(3);
  requestAnimationFrame(frame);
}
document.getElementById('bPlay').onclick = e => { e.stopPropagation(); setPlaying(!playing); };
document.getElementById('bSound').onclick = e => { e.stopPropagation(); soundOn ? disableSound() : enableSound(); };
document.getElementById('bFull').onclick = e => { e.stopPropagation(); document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); };
scrub.oninput = () => jump(parseFloat(scrub.value));
ui.onclick = e => e.stopPropagation();
stage.parentNode.addEventListener('click', () => { if (!soundOn) enableSound(); });
let idleT = null; const wake = () => { ui.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => ui.classList.add('idle'), 2600); };
addEventListener('mousemove', wake); addEventListener('touchstart', wake); wake();
addEventListener('keydown', e => {
  if (e.target === scrub && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'm' || e.key === 'M') soundOn ? disableSound() : enableSound();
  else if (e.key === 'ArrowRight') { setPlaying(false); jump(t + 1/FPS); }
  else if (e.key === 'ArrowLeft') { setPlaying(false); jump(t - 1/FPS); }
  else if (e.key === 'Home') jump(0);
  else if (e.key === 'f' || e.key === 'F') document.getElementById('bFull').click();
  wake();
});
setTimeout(() => { if (!soundOn) hint.style.opacity = 0; }, 6000);

window.FILM = { duration:D, fps:FPS, seek: x => { setPlaying(false); t = ((x % D) + D) % D; return seek(t); }, renderAudio:() => renderAudio().then(() => audioBuf), ready:null };
window.FILM.ready = document.fonts.ready.then(() => { seek(t); syncUI(); requestAnimationFrame(frame); return true; });
})();
</script>
</body>
